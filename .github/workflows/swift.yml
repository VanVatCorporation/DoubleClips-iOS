# This workflow will build a Swift project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-swift

name: Swift (Xcode Build)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Xcode version
      # Optional: Explicitly select an Xcode version if needed
      run: sudo xcode-select -s /Applications/Xcode.app

    - name: Build App
      run: |
        xcodebuild -project DoubleClips.xcodeproj \
                   -scheme DoubleClips \
                   -destination 'generic/platform=iOS Simulator' \
                   IPHONEOS_DEPLOYMENT_TARGET=18.0 \
                   ASSETCATALOG_COMPILER_APPICON_NAME=icon-ios-white \
                   "DoubleClips/Assets.xcassets" \
                   "DoubleClips/icon-ios-white.icon" \
                   build
